[theme]
primaryColor = "#FF4B4B"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1E222B"
textColor = "#FAFAFA"
font = "sans serif"

[server]
# enableCORS phải là true khi enableXsrfProtection bật: Streamlit tự ghi đè và in cảnh báo
# mỗi lần khởi động nếu đặt false. Ghi đúng ngay từ đầu để không ai đọc nhầm là đã tắt CORS.
enableCORS = true
enableXsrfProtection = true
# Tắt file-watcher: container production không cần hot-reload, đồng thời tránh việc
# watcher dò các module vision của transformers gây log noise 'No module named torchvision'.
fileWatcherType = "none"

[logger]
level = "warning"
